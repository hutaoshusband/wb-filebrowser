[package]
name = "wb-file-crypto"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
aes = { version = "0.8.4", features = ["zeroize"] }
argon2 = { version = "0.5.3", features = ["zeroize"] }
zeroize = "1.8"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "=0.2.100"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
